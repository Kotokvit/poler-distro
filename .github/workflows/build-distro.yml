name: Build POLER CachyOS ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DISTRO_VERSION: "1.2.0"
  # The sovereign engine is fetched as the OFFICIAL release binary (never
  # rebuilt from 389 MB of sources in CI) — build_iso.py pins its sha256:
  #   v0.61.0 / abd6e98b47b6282e929a6ddd6e7172c76c88e10ec5d45dce0d88a0388117b547
  ENGINE_RELEASE: "https://github.com/poler-engine-org/poler-engine/releases/download/v0.61.0/poler-engine"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout distro repository
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Install ISO and QEMU build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 xorriso grub-pc-bin grub-efi-amd64-bin mtools \
            squashfs-tools cpio zstd xz-utils curl ca-certificates \
            pkg-config libfuse-dev libfuse3-dev musl-tools
          echo "--- toolchain check ---"
          qemu-system-x86_64 --version | head -1
          mksquashfs -version 2>&1 | head -1
          xorriso --version 2>&1 | head -1 || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build sovereign poler-init + poler-powerctl (static musl) and poler-update
        run: |
          set -e
          mkdir -p binaries
          rustup target add x86_64-unknown-linux-musl
          # poler-init = PID 1, poler-powerctl = reboot/poweroff marker IPC:
          # both are STATIC musl builds — zero interpreter deps in both the
          # initramfs and the live system.
          (cd sovereign/poler-init && cargo build --release --target x86_64-unknown-linux-musl)
          cp sovereign/poler-init/target/x86_64-unknown-linux-musl/release/poler-init binaries/
          cp sovereign/poler-init/target/x86_64-unknown-linux-musl/release/poler-powerctl binaries/
          (cd sovereign/poler-update && cargo build --release)
          cp sovereign/poler-update/target/release/poler-update binaries/
          file binaries/poler-init | grep -q statically || echo "WARN: poler-init not static"
          file binaries/poler-powerctl | grep -q statically || echo "WARN: poler-powerctl not static"

      - name: Build poler-sh from Kotokvit/poler-sh
        run: |
          set -e
          git clone --depth 1 https://github.com/Kotokvit/poler-sh.git /tmp/poler-sh
          (cd /tmp/poler-sh && cargo build --release)
          cp /tmp/poler-sh/target/release/poler-sh binaries/
          echo "--- sovereign shell sanity ---"
          binaries/poler-sh -c "calc 2^10 + sqrt(144)*2"
          binaries/poler-sh -c "= 100 km/h to m/s"

      - name: Build poler archive suite from Kotokvit/poler
        run: |
          set -e
          git clone --depth 1 https://github.com/Kotokvit/poler.git /tmp/poler
          (cd /tmp/poler && cargo build --release --bin poler --bin poler-box)
          cp /tmp/poler/target/release/poler      binaries/
          cp /tmp/poler/target/release/poler-box  binaries/
          # poler-fuse is a workspace crate: build via package selector
          if (cd /tmp/poler && cargo build --release -p poler-fuse); then
            cp /tmp/poler/target/release/poler-fuse binaries/
          else
            echo "poler-fuse unavailable on this runner - building without it"
          fi

      - name: Verify the sovereign stack binaries
        run: |
          set -e
          ls -la binaries/
          file binaries/poler-init binaries/poler-powerctl binaries/poler-sh | sed 's/,/\n  /g'
          binaries/poler-sh -c "echo bash-is-gone-sovereign-OK"

      - name: Build the POLER CachyOS x86_64 ISO (engine = primary console shell)
        run: |
          set -e
          # reclaim disk occupied by intermediate cargo builds
          sudo rm -rf /tmp/poler-sh /tmp/poler sovereign/poler-init/target \
            sovereign/poler-update/target ~/.cargo/registry/cache || true
          df -h /
          sudo env "PATH=$PATH" "HOME=$HOME" \
            python3 builder/build_iso.py \
              --version "$DISTRO_VERSION" \
              --bins binaries \
              --out out \
              --qemu
          # out/ was produced under sudo — hand it back to the runner user
          sudo chown -R "$(id -u):$(id -g)" out

      - name: Package sovereign core asset for poler-update
        run: |
          set -e
          cd binaries
          # NOTE: poler-engine is deliberately NOT in the core tarball — the
          # engine is installed by its own sovereign release channel
          # (`poler-update --install engine`, sha256-pinned), not redistributed.
          if [ -f poler-fuse ]; then
            tar -czf "$GITHUB_WORKSPACE/out/poler-core-x86_64.tar.gz" \
              poler-init poler-powerctl poler-sh poler poler-box poler-fuse poler-update
          else
            tar -czf "$GITHUB_WORKSPACE/out/poler-core-x86_64.tar.gz" \
              poler-init poler-powerctl poler-sh poler poler-box poler-update
          fi
          cd "$GITHUB_WORKSPACE"
          cp manifest.json out/
          ( cd out && sha256sum \
              poler-cachyos-x86_64-*.iso \
              poler-core-x86_64.tar.gz \
              manifest.json > SHA256SUMS )
          ls -la out/

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poler-cachyos-iso
          path: out/
          retention-days: 14

      - name: Create GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/poler-cachyos-x86_64-*.iso
            out/poler-core-x86_64.tar.gz
            out/manifest.json
            out/SHA256SUMS
          body: |
            POLER CachyOS Sovereign Edition ${{ env.DISTRO_VERSION }} — engine as the console

            * Base: CachyOS x86_64 (linux-cachyos kernel, sovereign mirrors)
            * PID 1: poler-init v0.3.0 (no systemd) — engine supervision + rescue
            * Primary console shell: poler-engine v0.61.0 Terminal Gateway
              (official release binary, sha256-pinned; pipes, redirects, native retrieval)
            * Fallback/rescue shell: poler-sh 0.2.0 (`poler.rescue=1` GRUB entry)
            * Power control: poler-powerctl (reboot/poweroff/halt marker IPC to PID 1)
            * Updater: poler-update 1.2.0 (`--install engine` sovereign channel)
            * ISO: hybrid BIOS+UEFI, boot-verified in QEMU up to the Terminal Gateway
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
